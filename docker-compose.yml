---
name: cms-platform

services:
  redis:
    image: redis:8-alpine
    networks:
      - queue

  rq-worker:
    build:
      context: .
      dockerfile: redis_worker/Dockerfile
    depends_on:
      - redis
      - postgres
    networks:
      - queue
      - db
    environment:
      - RQ_REDIS_URL=redis://redis:6379
      - QUEUE_NAME=articles
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - db
      - web

  feed-parser:
    build:
      context: .
      dockerfile: feed_parser/Dockerfile
    env_file:
      - .env
    environment:
      LOG:LEVEL: INFO
    depends_on:
      - redis
      - postgres
    networks:
      - queue
      - db

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms
    env_file:
      .env
    volumes:
      - ./data/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    networks:
      - db
    ports:
      - "5432:5432"

networks:
  queue:
    driver: bridge
  db:
    driver: bridge
  web:
    driver: bridge

volumes:
  pg_data: