---
name: cms-platform

services:
  redis:
    image: redis:8-alpine
    networks:
      - queue

  feed-parser:
    build:
      context: .
      dockerfile: feed_parser/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - queue
      - db
#    command: ["-c", "tail -f /dev/null"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms
    env_file:
      .env
    volumes:
      - ./data/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    networks:
      - db
    ports:
      - "5432:5432"

networks:
  queue:
    driver: bridge
  db:
    driver: bridge

volumes:
  pg_data: